name: Validate Infrastructure

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-compose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout infrastructure repo
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Prepare validation environment
        run: cp .env.example .env

      - name: Validate backup scripts
        run: bash -n scripts/*.sh scripts/lib/*.sh

      - name: Validate docker-compose.yml
        run: docker compose config > /dev/null

      - name: Validate docker-compose.prebuilt.yml
        run: docker compose -f docker-compose.prebuilt.yml config > /dev/null

      - name: Validate docker-compose.external-db.yml
        run: docker compose -f docker-compose.external-db.yml config > /dev/null

      - name: Check registry image exists
        run: |
          echo "Checking whether the nopCommerce registry image is available."
          image="registry.arity.co.za/nopcommerce:latest"
          if ! docker manifest inspect "${image}"; then
            echo "Image not found. The first application build will publish it."
          fi
