services:
  # ═══════════════════════════════════════════════════════
  #  DATABASES
  # ═══════════════════════════════════════════════════════
  postgres:
    image: postgres:16-alpine
    container_name: db-infra-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: db-infra-sqlserver
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: ${MSSQL_PID}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa
          -P "${MSSQL_SA_PASSWORD}" -Q "SELECT 1" -C ||
          /opt/mssql-tools/bin/sqlcmd -S localhost -U sa
          -P "${MSSQL_SA_PASSWORD}" -Q "SELECT 1" -C
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: db-infra-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════
  #  APPLICATION: nopCommerce (built from YOUR FORK)
  # ═══════════════════════════════════════════════════════
  #
  #  This builds from ./nopcommerce-src/ — your fork of the
  #  nopCommerce repo. Clone it first:
  #
  #     make clone-nopcommerce
  #
  #  Then customize: add plugins to src/Plugins/ and themes
  #  to src/Presentation/Nop.Web/Themes/
  #
  nopcommerce:
    build:
      context: ./nopcommerce-src
      dockerfile: Dockerfile
    container_name: db-infra-nopcommerce
    ports:
      - "8080:80"
    environment:
      # Keep the database target outside the container writable layer so a
      # replacement container can attach to a restored database immediately.
      ConnectionStrings__ConnectionString: >-
        Host=postgres;Port=5432;
        Database=${NOPCOMMERCE_DB:-nopcommerce_local};
        Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};
        Pooling=true;Trust Server Certificate=true;
      ConnectionStrings__DataProvider: "postgresql"
      # Redis remains disabled by default to avoid the installation-time
      # FlushDatabaseAsync crash documented in the README.
      DistributedCacheConfig__Enabled: "${REDIS_CACHE_ENABLED:-false}"
      DistributedCacheConfig__DistributedCacheType: "${REDIS_CACHE_TYPE:-Redis}"
      DistributedCacheConfig__ConnectionString: >-
        ${REDIS_CONNECTION_STRING:-}
    volumes:
      # Persist only cryptographic keys. Mounting an empty volume over all of
      # App_Data hides files shipped in the image and can break nopCommerce.
      - nopcommerce_keys:/app/App_Data/DataProtectionKeys
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  sqlserver_data:
    driver: local
  redis_data:
    driver: local
  nopcommerce_keys:
    name: ${NOPCOMMERCE_KEYS_VOLUME:-infrastructure_nopcommerce_keys}
    driver: local
