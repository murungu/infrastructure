<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, sans-serif; }
  body { background: #f5f5f5; padding: 10px; max-width: 375px; margin: 0 auto; }
  .version { background: #000; color: #fff; padding: 8px; text-align: center; font-size: 12px; margin-bottom: 10px; border-radius: 4px; }
  .version.current { background: #c0392b; }
  .version.proposed { background: #27ae60; }
  
  h2 { font-size: 16px; margin: 20px 0 10px; }
  .label { font-size: 10px; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
  
  .cart { background: #fff; padding: 40px 20px; border-radius: 4px; text-align: center; }
  .cart-icon { width: 60px; height: 60px; background: #eee; border-radius: 50%; margin: 0 auto 16px; display: flex; align-items: center; justify-content: center; font-size: 24px; }
  .cart-text { font-size: 14px; color: #666; margin-bottom: 20px; }
  
  .btn-primary { background: #000; color: #fff; padding: 14px 24px; font-size: 14px; border-radius: 4px; display: inline-block; }
  .btn-secondary { background: #fff; border: 1px solid #000; color: #000; padding: 14px 24px; font-size: 14px; border-radius: 4px; display: inline-block; margin-top: 10px; }
  
  .featured { background: #fff; padding: 12px; border-radius: 4px; margin-top: 10px; }
  .featured-title { font-size: 14px; font-weight: bold; margin-bottom: 10px; }
  .product-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .product { padding: 8px; }
  .product-img { width: 100%; height: 100px; background: #ddd; border-radius: 4px; margin-bottom: 6px; }
  .product-name { font-size: 11px; }
</style>
</head>
<body>

<h2>📱 Empty Cart @ 375px</h2>

<div class="label">CURRENT — PROBLEM</div>
<div class="version current">❌ DEAD END. NO CTA, NO FEATURED PRODUCTS.</div>

<div class="cart">
  <div class="cart-icon">🛒</div>
  <div class="cart-text">Your Shopping Cart is empty!</div>
  <!-- Nothing else. User must navigate manually. -->
</div>

<div style="height: 30px;"></div>

<div class="label">PROPOSED — FIX</div>
<div class="version proposed">✅ CLEAR CTA + FEATURED PRODUCTS BELOW</div>

<div class="cart">
  <div class="cart-icon">🛒</div>
  <div class="cart-text">Your cart is empty</div>
  <div class="btn-primary">Continue Shopping</div>
  <div class="btn-secondary">View Best Sellers</div>
</div>

<div class="featured">
  <div class="featured-title">You might also like</div>
  <div class="product-grid">
    <div class="product">
      <div class="product-img"></div>
      <div class="product-name">500W Solar Panel</div>
    </div>
    <div class="product">
      <div class="product-img"></div>
      <div class="product-name">5kWh Battery</div>
    </div>
  </div>
</div>

</body>
</html>
